name: Build game with OBB importer
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        run: |
          set -e
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          AJ=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)/android.jar
          # 1) compile importer to dex
          mkdir -p classes dexout
          javac --release 8 -cp $AJ -d classes src/tvfix/*.java
          $BT/d8 --min-api 21 --lib $AJ --output dexout $(find classes -name '*.class')
          # 2) decode game (keep original dex), add importer activity
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          java -jar apktool.jar d -s -f game.apk -o game
          python3 patch_manifest.py
          mkdir -p game/assets && cp drive_link.txt game/assets/drive_link.txt
          java -jar apktool.jar b game -o unsigned.apk
          cp dexout/classes.dex classes2.dex
          zip -j unsigned.apk classes2.dex
          # 3) align + sign
          $BT/zipalign -p -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TV"
          $BT/apksigner sign --ks ks.jks --ks-pass pass:android --key-pass pass:android --out SuperMegaBaseball-TV-OBB.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SuperMegaBaseball-TV-OBB
          path: SuperMegaBaseball-TV-OBB.apk
